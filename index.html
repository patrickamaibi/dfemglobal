  <div class="sky-background" aria-hidden="true">

    <!-- Dotted Flight Trajectory Arc -->

      <defs>
        <linearGradient id="flightTrackGrad" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#d4af37" stop-opacity="0.02" />
          <stop offset="35%" stop-color="#d4af37" stop-opacity="0.45" />
          <stop offset="85%" stop-color="#f5df88" stop-opacity="0.8" />
          <stop offset="100%" stop-color="#d4af37" stop-opacity="0.05" />
        </linearGradient>
      </defs>
      <path class="flight-path" d="M -180 950 C 250 820, 600 550, 1050 420 C 1500 300, 1800 160, 2250 -100" />
    </svg>

    <!-- Enlarged Gold Jetliner Silhouette Moving Smoothly Along Path -->

        <defs>
          <linearGradient id="planeGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">

            <stop offset="25%" stop-color="#F5DF88" />
            <stop offset="65%" stop-color="#D4AF37" />
            <stop offset="100%" stop-color="#8C6615" />
          </linearGradient>
        </defs>
        <!-- Sleek, Aerodynamic Jetliner (Nose facing forward along flight direction) -->
        <g>
          <!-- Left Wing (Upper) -->
          <path d="M 54 56 L 40 12 C 39 8, 36 7, 34 9 C 32 11, 33 14, 35 18 L 45 56 Z" fill="url(#planeGoldGrad)" opacity="0.9" />
          <!-- Left Engine -->
          <ellipse cx="46" cy="36" rx="7.5" ry="2.5" fill="#A88020" />

          <!-- Right Wing (Lower) -->
          <path d="M 54 64 L 40 108 C 39 112, 36 113, 34 111 C 32 109, 33 106, 35 102 L 45 64 Z" fill="url(#planeGoldGrad)" opacity="0.9" />
          <!-- Right Engine -->
