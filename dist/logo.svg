<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E29D" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Group -->
  <g transform="translate(60, 60)">
    <!-- Globe Outer Ring -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#2A4365" stroke-width="2" opacity="0.6" />
    
    <!-- Globe Inner Fill / Sphere -->
    <circle cx="0" cy="0" r="34" fill="#0A192F" />
    
    <!-- Latitude / Longitude lines -->
    <ellipse cx="0" cy="0" rx="34" ry="14" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.5" />
    <ellipse cx="0" cy="0" rx="17" ry="34" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.5" />
    <line x1="-34" y1="0" x2="34" y2="0" stroke="#38BDF8" stroke-width="1" opacity="0.4" />
    <line x1="0" y1="-34" x2="0" y2="34" stroke="#38BDF8" stroke-width="1" opacity="0.4" />

    <!-- Continental Accents -->
    <path d="M-18 -12 Q-10 -20 2 -16 Q12 -12 8 0 Q-4 8 -16 2 Z" fill="#2563EB" opacity="0.4" />
    <path d="M-8 8 Q4 10 14 18 Q6 28 -6 22 Z" fill="#2563EB" opacity="0.4" />

    <!-- Golden Orbital Flight Swoosh -->
    <path d="M -44 18 C -36 -28, 20 -44, 42 -14 C 48 -4, 46 16, 26 32 C 10 44, -18 38, -34 26" 
          fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" filter="url(#goldGlow)" />
    
    <!-- Golden Airplane on the Swoosh -->
    <g transform="translate(38, -19) rotate(42) scale(0.9)">
      <path d="M 0 -14 L 4 -2 L 14 3 L 4 5 L 3 11 L 7 14 L 0 13 L -7 14 L -3 11 L -4 5 L -14 3 L -4 -2 Z" 
            fill="url(#goldGrad)" />
    </g>
  </g>

  <!-- Typography Group -->
  <!-- Main Brand Name -->
  <text x="130" y="62" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="28" font-weight="700" letter-spacing="3" fill="#FFFFFF">
    D'KINGSFEMS
  </text>
  
  <!-- Sub Brand Name -->
  <text x="132" y="85" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" letter-spacing="8" fill="url(#goldGrad)">
    GLOBAL LTD
  </text>
</svg>
