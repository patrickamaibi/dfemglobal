  <!--
    Static splash: shown from the first paint until React starts, on every page load and refresh,
    so visitors never see a blank cream screen before the animated loader. It shows the same
    logo, at the same size and position, as PageLoader, so nothing jumps when React takes over.
    PageLoader removes it as soon as React mounts.
  -->
  <style>
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9998; /* just under the animated loader (9999) */
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050D1A;
      /* Safety net: if the app fails to start, get out of the way after 6 seconds */
      animation: boot-splash-out 0.4s ease 6s forwards;
    }
    #boot-splash img {
      display: block;
      width: min(80vw, 20rem); /* keep in step with the logo size in PageLoader.tsx */
      height: auto;
      filter: brightness(0) invert(1); /* white logo on the navy background */
    }
    @keyframes boot-splash-out { to { opacity: 0; visibility: hidden; } }
  </style>
  <noscript><style>#boot-splash { display: none; }</style></noscript>
